<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ChatBot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    .dot {
      animation: blink 1.4s infinite both;
    }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }

    @keyframes blink {
      0% { opacity: .2; }
      20% { opacity: 1; }
      100% { opacity: .2; }
    }

  </style>
</head>

<body class="bg-zinc-900 text-white h-screen flex">


{% include "utils/sidebar.html" %}



<main class="flex-1 flex flex-col">

  {% include "utils/header.html" %}


    {% block message %}
    {% endblock message %}

  <form id="chatForm" class="p-4 flex gap-2">
  <input
    id="query"
    class="flex-1 p-3 rounded-xl bg-zinc-800 text-white"
    placeholder="Type message..."
    autocomplete="off"
  />
  <button type="submit" class="bg-indigo-600 px-5 rounded-xl">Send</button>
</form>

</main>

<script>
const chatBox = document.getElementById("chatBox");
const form = document.getElementById("chatForm");
const input = document.getElementById("query");

function scrollBottom() {
  chatBox.scrollTop = chatBox.scrollHeight;
}

function addUserMessage(text) {
  const div = document.createElement("div");
  div.className = "flex justify-end";
  div.innerHTML = `
    <div class="bg-indigo-600 p-4 rounded-2xl max-w-2xl">
      ${text}
    </div>`;
  chatBox.appendChild(div);
  scrollBottom();
}

function addTypingBubble() {
  const div = document.createElement("div");
  div.className = "flex gap-3";
  div.innerHTML = `
    <div class="bg-zinc-800 p-4 rounded-2xl max-w-2xl typing">
      <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
    </div>`;
  chatBox.appendChild(div);
  scrollBottom();
  return div.querySelector(".typing");
}

function typeText(element, text, speed = 15) {
  element.innerHTML = "";
  let i = 0;

  const interval = setInterval(() => {
    element.innerHTML += text[i] || "";
    i++;
    scrollBottom();
    if (i >= text.length) clearInterval(interval);
  }, speed);
}

function addChatToSidebar(chatId, title) {
  const chatList = document.getElementById("chatList");
  if (!chatList) return;

  if (document.getElementById(`chat-${chatId}`)) return;

  const a = document.createElement("a");
  a.href = `/?chat_id=${chatId}`;
  a.id = `chat-${chatId}`;
  a.className = "p-3 bg-zinc-700 rounded cursor-pointer block";
  a.textContent = title;

  chatList.prepend(a);
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const query = input.value.trim();
  if (!query) return;

  addUserMessage(query);
  input.value = "";

  const typingBubble = addTypingBubble();

  const res = await fetch(window.location.pathname + window.location.search, {
    method: "POST",
    headers: {
      "X-CSRFToken": "{{ csrf_token }}",
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: new URLSearchParams({ query })
  });

  const data = await res.json();

  typeText(typingBubble, data.assistant);

  if (data.chat_id && !window.location.search.includes("chat_id")) {
    window.history.pushState({}, "", `/?chat_id=${data.chat_id}`);
    addChatToSidebar(data.chat_id, data.chat_title);
  }
});
</script>






</body>
</html>
