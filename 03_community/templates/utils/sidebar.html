<div class="w-60 bg-[#2b2d31] flex flex-col">

        <div class="p-4 font-bold border-b border-black/30">
            Community
        </div>

        <div class="flex-1 p-2 space-y-1">

            <a href="{% url "feed" %}" class="block px-2 py-1 rounded hover:bg-[#35373c]">
                # feed
            </a>

            <a href="{% url "chat_list" %}" class="block px-2 py-1 rounded hover:bg-[#35373c]">
                # chats
            </a>

            <a href="{% url "profile" %}" class="block px-2 py-1 rounded hover:bg-[#35373c]">
                # profile
            </a>

        </div>


        <div class="bg-[#232428] p-3 flex items-center gap-2">

            <img 
                src="{% if request.user.profile%}{{ request.user.profile.url }}{% else %}https://static.vecteezy.com/system/resources/thumbnails/009/292/244/small/default-avatar-icon-of-social-media-user-vector.jpg{% endif %}"
                alt="profile"
                class="w-8 h-8 rounded-full object-cover"
            >
            <div>
                <div class="text-sm font-semibold">
                    {{request.user.username}}
                </div>

                <div class="text-xs text-green-400">
                    online
                </div>
            </div>

        </div>

    </div>
