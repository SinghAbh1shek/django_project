<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}Community{% endblock %}</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-[#313338] text-white">

{% include "utils/navbar.html" %}



<div class="flex h-[calc(100vh-48px)]">

    {% comment %} {% include "utils/server_bar.html" %} {% endcomment %}
    {% include "utils/sidebar.html" %}



    <div class="flex-1 flex flex-col">

        <div class="h-12 border-b border-black/30 flex items-center px-4 font-semibold">

            {% block header %}
            Header
            {% endblock %}

        </div>


        <!-- PAGE CONTENT -->
        <div class="flex-1 flex flex-col p-4 min-h-0">

            {% block content %}
            {% endblock %}

        </div>

    </div>




    {% include "utils/members.html" %}

</div>


<script>
const messages = document.getElementById('messages');
if (messages) {
    messages.scrollTop = messages.scrollHeight;
}
</script>

</body>
</html>
