<div class="h-12 bg-[#232428] flex items-center justify-between px-4 border-b border-black/30">
    <div class="flex items-center gap-3">

        <div class="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center font-bold">
            C
        </div>

        <div class="font-semibold">
            Community
        </div>

    </div>


    <div class="w-[400px]">

        <input
        type="text"
        placeholder="Search..."
        class="w-full bg-[#383a40] px-3 py-1 rounded text-sm focus:outline-none"
        >

    </div>

    <div class="flex items-center gap-4">


        <a href="{% url "profile" %}" class="flex items-center gap-2 cursor-pointer hover:bg-[#35373c] px-2 py-1 rounded">
            <div class="w-7 h-7 rounded-full overflow-hidden">

                <img 
                    src="{{ request.user.profile.url }}" 
                    alt="profile"
                    class="w-full h-full object-cover"
                >
            </div>

            <div class="text-sm">
                {% if request.user.first_name %}
                    {{ request.user.first_name }}
                {% else %}
                    {{ request.user.username }}
                {% endif %}
            </div>

        </a>



        <a href="{% url "logout" %}" class="text-sm hover:text-red-400">
            Logout
        </a>

    </div>

</div>
