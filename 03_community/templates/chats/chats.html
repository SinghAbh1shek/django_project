{% extends "utils/base.html" %}

{% block title %}
Chat
{% endblock %}

{% block header %}
# general
{% endblock %}

{% block content %}


<div class="flex flex-col h-full">


    <div id="messages" class="flex-1 overflow-y-auto space-y-4">

        {% for message in messages %}

        <div class="flex gap-3">

            <div class="w-10 h-10 bg-green-500 rounded-full"></div>

            <div>

                <div class="font-semibold">
                    friend
                </div>

                <div class="text-gray-300">
                    hii
                </div>

            </div>

        </div>

        {% empty %}


        <div class="text-gray-400 text-center mt-10">
            No messages yet. Start the conversation.
        </div>

        {% endfor %}

    </div>


    <form method="POST" class="mt-4 flex gap-2">

        {% csrf_token %}

        <input
        name="content"
        class="flex-1 bg-[#383a40] p-3 rounded focus:outline-none"
        placeholder="Message #general"
        autocomplete="off"
        >

        <button class="bg-indigo-500 px-4 rounded hover:bg-indigo-600">
            Send
        </button>

    </form>

</div>

{% endblock %}
