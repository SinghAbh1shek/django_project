{% extends "utils_seller/base.html" %}
{% block title %}Add Product{% endblock title %}

{% block start %}

<div class="card mt-4 shadow-sm">
    <div class="card-header bg-light">
        <h5 class="mb-0">Add Product</h5>
    </div>

    <div class="card-body">


        <form method="get">
            <div class="mb-4">
                <label class="form-label fw-semibold">
                    Select Category
                </label>

                <select name="category"
                        class="form-select form-select-lg"
                        onchange="this.form.submit()">

                    <option value="">All Categories</option>
                    {% for cat in categories %}
                        <option value="{{ cat.id }}"
                            {% if selected_category_id == cat.id|stringformat:"s" %}
                                selected
                            {% endif %}>
                            {{ cat.category_name }}
                        </option>
                    {% endfor %}
                </select>

                <div class="form-text">
                    Filter products by category
                </div>
            </div>
        </form>

        <form method="post">
            {% csrf_token %}

            <div class="mb-4">
                <label class="form-label fw-semibold">
                    Select Product
                </label>

                <select name="product"
                        class="form-select form-select-lg"
                        required>

                    <option value="">Search & select a product</option>
                    {% for product in product_lists %}
                        <option value="{{ product.id }}">
                            {{ product.title|truncatewords:10 }} — ₹{{ product.mrp }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">
                    Your Selling Price
                </label>

                <input name="price"
                       type="number"
                       step="0.01"
                       class="form-control form-control-lg"
                       placeholder="₹ Enter your price"
                       required>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input"
                       type="checkbox"
                       name="is_active"
                       checked>

                <label class="form-check-label">
                    Active for sale
                </label>
            </div>

            <div class="text-end">
                <button type="submit"
                        class="btn btn-success btn-lg px-4">
                    Add to My Store
                </button>
            </div>
        </form>

    </div>
</div>

{% endblock start %}
