{% extends "utils_seller/base.html" %}

{% block start %}

<div class="card mt-4 shadow-sm">
    <div class="card-header bg-light">
        <h5 class="mb-0">Shop Details</h5>
    </div>

    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Shop Name</label>
                    <input type="text"
                        name="shop_name"
                        class="form-control"
                        placeholder="Enter shop name"
                        required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">BMP ID</label>
                    <input type="text"
                        name="bmp_id"
                        class="form-control"
                        placeholder="Enter BMP ID"
                        required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">GST Number</label>
                    <input type="text"
                           name="gst_number"
                           class="form-control"
                           placeholder="Enter GST number"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Aadhar Number</label>
                    <input type="text"
                           name="adhar_number"
                           class="form-control"
                           placeholder="Enter Aadhar number"
                           required>
                    
                </div>
            </div>


            <div class="mb-4">
                <label class="form-label fw-semibold">Aadhar Image</label>
                <input type="file"
                       name="adhar_image"
                       class="form-control"
                       accept="image/png, image/jpeg"
                       >
                <small class="text-muted">
                        Allowed formats: JPG, JPEG, PNG
                </small>
            </div>

            

            <div class="text-end">
                <button type="submit"
                        class="btn btn-primary px-4">
                    Save Details
                </button>
            </div>
        </form>
    </div>
</div>


{% endblock start %}
