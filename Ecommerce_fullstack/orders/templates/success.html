{% extends "utils/base.html" %}
{% block title %}
Payment Success
{% endblock title %}
{% block start %}

<div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center bg-light">
    <div class="card shadow-lg p-5 text-center" style="max-width: 450px; width: 100%;">

        <div class="mb-3">
            <i class="fas fa-check-circle text-success" style="font-size: 64px;"></i>
        </div>

        <h3 class="mb-2 text-success fw-bold">Payment Successful!</h3>

        <p class="text-muted mb-4">
            Thank you for your purchase.  
            Your order has been placed successfully.
        </p>


        <div class="d-grid gap-2">
            <a href="{% url "order" %}" class="btn btn-success btn-lg rounded-pill">
                View My Orders
            </a>

            <a href="{% url 'home' %}" class="btn btn-outline-secondary rounded-pill">
                Continue Shopping
            </a>
        </div>


        <small class="text-muted mt-4 d-block">
            Payment secured via Razorpay
        </small>
    </div>
</div>



{% endblock start %}
