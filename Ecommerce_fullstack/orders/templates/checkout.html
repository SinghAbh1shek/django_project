{% extends "utils/base.html" %}
{% block title %}
Checkout
{% endblock title %}

{% block start %}

<div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center bg-light">
    <div class="card shadow-lg p-4 text-center" style="max-width: 420px; width: 100%;">
        
        <h4 class="mb-2">Ready to Pay?</h4>
        <p class="text-muted mb-4">
            Click below to complete your payment securely
        </p>

            <button 
                type="submit" 
                id="rzp-button1"
                class="btn btn-primary btn-lg rounded-pill fw-semibold"
            >
                💳 Pay Now
            </button>

        <small class="text-muted mt-3 d-block">
            Secured by Razorpay
        </small>
    </div>
</div>


<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
var options = {
    "key": "rzp_test_RzKMJcZFqANCJq",
    "amount": "{{ amount }}",
    "currency": "INR",
    "name": "Company Name",
    "description": "Order Payment",
    "order_id": "{{ payment_info.id }}",
    "callback_url": "{{callback_url}}?order_id={{payment_info.id}}",
    "theme": {
        "color": "#3399cc"
    }
};

var rzp1 = new Razorpay(options);
document.getElementById("rzp-button1").onclick = function (e) {
    rzp1.open();
    e.preventDefault();
};
</script>



{% endblock start %}
